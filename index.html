/* =========================

.icon{

height:42px;

main{

.deck{

}

/* =========================

========================= */

.card{
position:absolute;
inset:0;

overflow:hidden;

border-radius:28px;

background:#171717;

box-shadow:0 18px 45px #000;

touch-action:none;

user-select:none;

transition:
transform .3s ease,
opacity .3s ease;
}

.card img{
width:100%;
height:100%;

object-fit:cover;

display:block;
}

.card:after{
content:"";

position:absolute;
inset:0;

background:
linear-gradient(
transparent 35%,

#000e 100%
);
}

.info{
position:absolute;

z-index:3;

left:22px;
right:22px;
bottom:22px;
}

.name{
font-size:30px;
font-weight:900;
}

.age{
font-size:20px;
color:#ddd;
}

.meta{
margin-top:7px;

}

.tag{
display:inline-block;

background:#ffffff22;

padding:6px 9px;

border-radius:20px;

margin:7px 4px 0 0;

font-size:11px;

}

/* =========================
SWIPE STAMPS
========================= */

.stamp{
position:absolute;

z-index:5;

top:35px;

padding:7px 13px;

border:4px solid;

border-radius:10px;

font-size:27px;

font-weight:1000;

opacity:0;
}

.likeStamp{
left:20px;

color:#45e58a;

border-color:#45e58a;

transform:rotate(-12deg);
}

.noStamp{
right:20px;

color:#ff5263;

border-color:#ff5263;

transform:rotate(12deg);
}

/* =========================
ACTION AREA
========================= */

.actions{
height:92px;

display:flex;

justify-content:center;

align-items:center;

gap:18px;

flex-shrink:0;
}

.action{
border-radius:50%;

display:grid;

place-items:center;

box-shadow:0 8px 20px #0008;

transition:
transform .15s ease;
}

.action:active{
transform:scale(.88);
}

/* PASS */

height:66px;

linear-gradient(
145deg,

height:52px;

width:50px;
height:31px;

display:flex;

justify-content:center;

overflow:hidden;

background:#fff;

border-radius:
8px
8px
22px
22px;

2px
3px
5px;

0 2px 5px #0008;

position:relative;
}

width:8px;
height:16px;

background:#fff;

border:1px solid #ddd;

border-radius:
0
0
4px
4px;

.good-mouth:after{
content:"";

position:absolute;

width:31px;
height:4px;

background:#f1a8b0;

border-radius:50%;

}

/* =========================
BAD TEETH
========================= */

.bad-mouth{
width:50px;
height:31px;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:#351616;

border:2px solid #8b3b3b;

border-radius:
7px
7px
18px
18px;

inset 0 2px 5px #000;
}

.bad-tooth{

width:10px;
height:18px;

filter:
saturate(.55)
sepia(.35);

}

.bad-tooth.crooked{
transform:
rotate(27deg)

}

height:18px;

/* =========================

.empty{
height:100%;

place-items:center;

nav{

display:flex;

1px solid #ffffff12;

/* =========================
LIKES PANEL
========================= */

.sheet{
position:fixed;

inset:0;

background:#0009;

z-index:110;

display:none;

}

.sheet.open{
display:flex;
}

.panel{
width:100%;

max-width:520px;

margin:auto;

background:#151515;

border-radius:
28px
28px
0
0;

padding:
18px
20px
30px;

max-height:82dvh;

overflow:auto;
}

.panel h2{
margin:
4px
0
18px;
}

.close{
float:right;

width:34px;
height:34px;

border-radius:50%;

background:#292929;

color:#fff;

font-size:20px;
}

.list{
display:grid;

gap:10px;
}

.liked{
display:flex;

align-items:center;

gap:12px;

background:#202020;

border-radius:15px;

padding:8px;
}

.liked img{
width:62px;
height:72px;

object-fit:cover;

border-radius:10px;
}

.liked strong{
font-size:17px;
}

.liked small{
display:block;

/* =========================
TOAST
========================= */

.toast{
position:fixed;

z-index:200;

left:50%;

bottom:88px;

transform:
translate(-50%,20px);

opacity:0;

background:#fff;

color:#111;

padding:
11px
16px;

border-radius:99px;

font-weight:900;

transition:.25s;

pointer-events:none;
}

.toast.show{

transform:
translate(-50%,0);

</style>

<script>

/* ==================================================
   HOLLYWOOD ACTORS
================================================== */

const actors=[

[
"Chris Evans",
"43",
"Captain America • Knives Out",
"Chris_Evans"
],

[
"Henry Cavill",
"43",
"Superman • The Witcher",
"Henry_Cavill"
],

[
"Michael B. Jordan",
"39",
"Creed • Black Panther",
"Michael_B._Jordan"
],

[
"Ryan Gosling",
"45",
"Barbie • La La Land",
"Ryan_Gosling"
],

[
"Chris Hemsworth",
"42",
"Thor • Extraction",
"Chris_Hemsworth"
],

[
"Pedro Pascal",
"51",
"The Last of Us • Gladiator II",
"Pedro_Pascal"
],

[
"Regé-Jean Page",
"38",
"Bridgerton • The Gray Man",
"Regé-Jean_Page"
],

[
"Dev Patel",
"36",
"Lion • Slumdog Millionaire",
"Dev_Patel"
],

[
"Jonathan Bailey",
"38",
"Bridgerton • Wicked",
"Jonathan_Bailey"
],

[
"Glen Powell",
"37",
"Anyone But You • Top Gun",
"Glen_Powell"
],

[
"Oscar Isaac",
"47",
"Dune • Ex Machina",
"Oscar_Isaac"
],

[
"Simu Liu",
"37",
"Shang-Chi • Barbie",
"Simu_Liu"
]

];


/* ==================================================
   APP STATE
================================================== */

let index =
Number(
localStorage.getItem(
"breumbleIndex"
) || 0
);


let liked =
JSON.parse(
localStorage.getItem(
"breumbleLiked"
) || "[]"
);


/* ==================================================
   ELEMENTS
================================================== */

const deck =
document.getElementById(
"deck"
);


const toast =
document.getElementById(
"toast"
);


/* ==================================================
   SAVE SWIPE DATA
================================================== */

function save(){

localStorage.setItem(
"breumbleIndex",
index
);

localStorage.setItem(
"breumbleLiked",
JSON.stringify(liked)
);

}


/* ==================================================
   TOAST
================================================== */

function showToast(message){

toast.textContent =
message;

toast.classList.add(
"show"
);

setTimeout(
()=>{
toast.classList.remove(
"show"
);
},
1300
);

}


/* ==================================================
   PLACEHOLDER FOR ACTOR PHOTOS
================================================== */

function placeholder(name){

const initials =
name
.split(" ")
.map(x=>x[0])
.join("");


return "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`

<svg
xmlns="http://www.w3.org/2000/svg"
width="800"
height="1100">

<defs>

<linearGradient
id="g"
x1="0"
x2="1"
y1="0"
y2="1">

<stop
stop-color="#3a2508"/>

<stop
offset=".5"
stop-color="#111"/>

<stop
offset="1"
stop-color="#5b1019"/>

</linearGradient>

</defs>


<rect
width="100%"
height="100%"
fill="url(#g)"
/>


<text
x="50%"
y="48%"
dominant-baseline="middle"
text-anchor="middle"
fill="#f4c542"
font-size="150"
font-family="Arial"
font-weight="900">

${initials}

</text>


<text
x="50%"
y="60%"
text-anchor="middle"
fill="white"
font-size="34"
font-family="Arial">

${name}

</text>

</svg>

`);

}


/* ==================================================
   GET ACTOR PHOTO
================================================== */

async function actorImage(slug){

try{

const response =
await fetch(
"https://en.wikipedia.org/api/rest_v1/page/summary/"
+
encodeURIComponent(slug)
+
"?redirect=true"
);


const data =
await response.json();


return(
data.thumbnail?.source ||
data.originalimage?.source ||
""
);


}catch(e){

return "";

}

}


/* ==================================================
   CREATE ACTOR CARD
================================================== */

function makeCard(
actor,
position
){

const card =
document.createElement(
"div"
);


card.className =
"card";


card.style.zIndex =
100-position;


card.innerHTML = `

<img
class="actorPhoto"
src="${placeholder(actor[0])}"
alt="${actor[0]}"
>


<div class="stamp likeStamp">

LIKE

</div>


<div class="stamp noStamp">

NOPE

</div>


<div class="info">


<div>

<span class="name">

${actor[0]}

</span>


<span class="age">

${actor[1]}

</span>

</div>


<div class="meta">

${actor[2]}

</div>


<span class="tag">

HOLLYWOOD

</span>


<span class="tag">

BREUMBLE

</span>


</div>

`;


actorImage(
actor[3]
)
.then(url=>{

if(url){

card
.querySelector(
".actorPhoto"
)
.src=url;

}

});


if(position===0){

attachSwipe(card);

}


return card;

}


/* ==================================================
   RENDER DECK
================================================== */

function render(){

deck.innerHTML="";


if(index>=actors.length){

deck.innerHTML = `

<div class="empty">

<div>

<div style="font-size:60px">

🎬

</div>


<h2>

That's a wrap!

</h2>


<p>

Breanna has seen everyone
in this Breumble lineup.

</p>


<button
class="reset"
id="resetBtn">

Start Over

</button>

</div>

</div>

`;


document.getElementById(
"resetBtn"
).onclick=()=>{

index=0;

liked=[];

save();

render();

};


return;

}


for(
let position=2;
position>=0;
position--
){

const i =
index+position;


if(i<actors.length){

const card =
makeCard(
actors[i],
position
);


if(position>0){

card.style.transform =
`
scale(${1-position*.035})
translateY(${position*10}px)
`;

}


deck.appendChild(card);

}

}

}


/* ==================================================
   SWIPE ENGINE
================================================== */

function attachSwipe(card){

let startX=0;

let dx=0;

let dragging=false;


function move(event){

if(!dragging)
return;


const point =
event.touches
?
event.touches[0]
:
event;


dx =
point.clientX-startX;


const rotation =
dx/18;


card.style.transition =
"none";


card.style.transform =
`
translate(${dx}px,0)
rotate(${rotation}deg)
`;


card.querySelector(
".likeStamp"
).style.opacity =
Math.min(
1,
Math.max(
0,
dx/110
)
);


card.querySelector(
".noStamp"
).style.opacity =
Math.min(
1,
Math.max(
0,
-dx/110
)
);

}


function end(){

if(!dragging)
return;


dragging=false;


if(Math.abs(dx)>105){

finish(
dx>0
?
"like"
:
"pass"
);

}else{

card.style.transform =
"";


card.querySelector(
".likeStamp"
).style.opacity=0;


card.querySelector(
".noStamp"
).style.opacity=0;

}

}


card.addEventListener(
"touchstart",
event=>{

dragging=true;

startX =
event.touches[0].clientX;

dx=0;

},
{
passive:true
}
);


card.addEventListener(
"touchmove",
move,
{
passive:true
}
);


card.addEventListener(
"touchend",
end
);


card.addEventListener(
"mousedown",
event=>{

dragging=true;

startX =
event.clientX;

dx=0;

}
);


window.addEventListener(
"mousemove",
move
);


window.addEventListener(
"mouseup",
end
);

}


/* ==================================================
   FINISH SWIPE
================================================== */

function finish(type){

const actor =
actors[index];


const card =
deck.querySelector(
".card"
);


if(!actor||!card)
return;


card.style.transition =
"transform .35s ease,opacity .35s ease";


card.style.transform =
`
translate(
${type==="like"?1000:-1000}px,
80px
)
rotate(
${type==="like"?25:-25}deg
)
`;


card.style.opacity =
"0";


setTimeout(
()=>{

if(
type==="like" &&
!liked.some(
x=>x[0]===actor[0]
)
){

liked.push(actor);

}


index++;

save();

render();


showToast(
type==="like"
?
"❤️ Breumble!"
:
"✕ Next!"
);

},
220
);

}


/* ==================================================
   ACTION BUTTONS
================================================== */

document.getElementById(
"passBtn"
).onclick =
()=>{
finish("pass");
};


document.getElementById(
"likeBtn"
).onclick =
()=>{
finish("like");
};


document.getElementById(
"superBtn"
).onclick =
()=>{
finish("like");
};


/* ==================================================
   START BREUMBLING
================================================== */

document.getElementById(
"startBtn"
).onclick = ()=>{

const welcome =
document.getElementById(
"welcome"
);


welcome.classList.add(
"hide"
);


setTimeout(
()=>{
welcome.style.display="none";
},
550
);


render();

};


/* ==================================================
   LIKED ACTORS
================================================== */

function renderLikes(){

const list =
document.getElementById(
"likesList"
);


if(!liked.length){

list.innerHTML = `

<p
style="
color:#999;
text-align:center;
line-height:1.6
">

No Breumbles yet.

<br>

Start swiping! ❤️

</p>

`;

return;

}


list.innerHTML =
liked.map(
actor=>`

<div class="liked">

<img
